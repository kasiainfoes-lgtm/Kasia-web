name: Deploy to VPS

on:
  push:
    branches: [main]

# Dos pushes seguidos a main (ej: mergear dos PRs con segundos de diferencia)
# disparaban dos deploys en paralelo, y ambos corrían `npm run build` al mismo
# tiempo sobre la misma carpeta .next en el VPS, chocando entre sí (ENOTEMPTY
# al limpiar .next/export). Con esto, un push nuevo espera a que el deploy en
# curso termine en vez de correr al mismo tiempo.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # VPS_SSH_KEY is stored as a single base64 line (not a raw multi-line
      # PEM block) so it survives copy/paste into the GitHub secret UI
      # without a stray line break silently corrupting it. Decode it here.
      - name: Decode deploy key
        id: key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > /tmp/deploy_key
          {
            echo 'private_key<<KEYEOF'
            cat /tmp/deploy_key
            echo KEYEOF
          } >> "$GITHUB_OUTPUT"
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ steps.key.outputs.private_key }}
          script: |
            set -e
            cd /var/www/Kasia-web
            git pull origin main
            npm install
            npm run build
            pm2 restart kasia
