name: Send review reminder emails

# No hay nada en el VPS que corra cron jobs, así que este workflow hace de
# reloj: pega todos los días contra /api/cron/review-reminders, que es el
# que de verdad decide a quién mandarle el recordatorio (reservas pagadas
# hace 60+ días que todavía no lo recibieron).
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC todos los días
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger review reminders
        run: |
          curl -sS --fail -X POST "https://kasiainmobiliaria.es/api/cron/review-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
